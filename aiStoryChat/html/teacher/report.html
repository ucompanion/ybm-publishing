    <body>
        <!-- page-wrap -->
        <div class="wrapper sub-wrap">
            <header class="header">
                <h1 class="logo"><a href="/"><span class="blind">AI스토리챗</span></a></h1>
            </header>
            <!-- page-body -->
            <main class="container">
                <!-- content -->
                <div class="content report-page">
                    <div class="content-header">
                        <h2 class="content-title">결과리포트</h2>
                    </div>
                    <div class="content-body">
                        <div class="board-sec">
                            <div class="sec-header">
                                <div class="sec-util">
                                    <button type="button" class="btn-primary">
                                        <span>스토리 확인하기</span>
                                    </button>
                                    <button type="button" class="btn-delete">
                                        <span>삭제</span>
                                    </button>
                                </div>
                            </div>
                            <div class="sec-body">
                                <table class="board-table">
                                    <caption class="blind">단원 상세정보</caption>
                                    <colgroup>
                                        <col style="width: 160px" />
                                        <col style="width: auto" />
                                        <col style="width: 160px" />
                                        <col style="width: auto" />
                                        <col style="width: 160px" />
                                        <col style="width: auto" />
                                    </colgroup>
                                    <tbody>
                                        <tr>
                                            <th scope="row">단원</th>
                                            <td colspan="3" class="cel-lesson">Lesson 1. Hello, i’m Dito</td>
                                        </tr>
                                        <tr>
                                            <th scope="row">진행일</th>
                                            <td class="cel-date">2025-04-25 14:30</td>
                                            <th scope="row">단어 수</th>
                                            <td class="cel-word">6</td>
                                            <th scope="row">참여자 수</th>
                                            <td class="cel-users">6</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <table class="board-table">
                                    <caption class="blind">단원 상세목록</caption>
                                    <colgroup>
                                        <col style="width: 60px" />
                                        <col style="width: 80px" />
                                        <col style="width: 175px" />
                                        <col style="width: 150px" />
                                        <col style="width: auto" />
                                        <col style="width: 140px" />
                                    </colgroup>
                                    <thead>
                                        <tr>
                                            <th scope="col">번호</th>
                                            <th scope="col">이름</th>
                                            <th scope="col">말한 단어</th>
                                            <th scope="col">대화 시간</th>
                                            <th scope="col">교정 문장</th>
                                            <th scope="col">더 좋은 표현 문장</th>
                                            <th scope="col">대화 다시 보기</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td class="cel-checkbox">
                                                <label class="frm-chk">
                                                    <input type="checkbox" name="reportChk" class="chk" title="Lesson 1. Hello, i’m Dito 선택" />
                                                    <span class="label"></span>
                                                </label>
                                            </td>
                                            <td class="cel-num">9999</td>
                                            <td class="cel-date">2025-04-25 14:30</td>
                                            <td class="cel-book">영어 3 (김혜리)</td>
                                            <td class="cel-lesson">Lesson 1. Hello, i’m Dito</td>
                                            <td class="cel-users">12</td>
